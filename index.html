<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="color-scheme" content="dark"><meta name="apple-mobile-web-app-capable" content="yes"><title>Shelf</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#000;--card:#111114;--tx:#fff;--mut:#9a9aa8;--ac:#ffb020;--acx:#000;--line:#26262e;--ok:#4cd08f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 'DM Sans',system-ui,sans-serif}
h1,h2,.tab{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{max-width:980px;margin:0 auto;padding:20px 16px 80px}
.logo{font:800 22px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;margin:0 0 14px}
#tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;font-weight:700;font-size:17px;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap}
.tab span{font:500 12px 'DM Sans',sans-serif;margin-left:7px;background:var(--line);padding:1px 7px;border-radius:99px}
.tab.on{color:var(--tx);border-color:var(--ac)}
h2{font-size:15px;font-weight:700;color:var(--mut);margin:0 0 10px}
#favs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:30px}
.fav,.pw{aspect-ratio:2/3;border-radius:8px;overflow:hidden;position:relative;background:var(--card);border:1px solid var(--line)}
.fav{padding:0;display:grid;place-items:center;transition:transform .15s,border-color .15s}
.fav:hover{transform:translateY(-3px);border-color:var(--ac)}
.fav b{font-size:34px;font-weight:400;color:var(--mut)}
img{display:block;width:100%;height:100%;object-fit:cover}
.ph{display:grid;place-items:center;height:100%;padding:8px;text-align:center;color:var(--mut);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 14px}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
#q{flex:1;min-width:120px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px}
.btn{background:var(--ac);color:var(--acx);border:0;border-radius:99px;padding:8px 18px;font-weight:700}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--line)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px}
.card{cursor:pointer}
.card p{margin:6px 0 0;font-weight:500;font-size:14px;line-height:1.3}
.card:hover .pw{border-color:var(--ac)}
.pw em{position:absolute;right:6px;top:6px;background:var(--ok);color:#fff;font-style:normal;font-size:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.empty{grid-column:1/-1;color:var(--mut);padding:40px 0;text-align:center}
#ov{position:fixed;inset:0;background:rgba(8,9,14,.7);display:none;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 14px 30px;z-index:20}
#ov.on{display:block}
.sheet{background:#0c0c10;max-width:560px;margin:0 auto;border-radius:14px;padding:20px;border:1px solid var(--line)}
.sheet h1{font-size:22px;margin:0 0 14px}
.sheet label{display:block;font-size:13px;color:var(--mut);margin-bottom:12px}
.sheet input[type=text],.sheet input[type=number],.sheet textarea{display:block;width:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--tx)}
.sheet textarea{min-height:90px;resize:vertical}
.up{cursor:pointer}
#pp{width:130px;aspect-ratio:2/3;border:2px dashed var(--line);border-radius:8px;overflow:hidden;display:grid;place-items:center;text-align:center;font-size:13px;margin-top:4px}
.seg{display:flex;gap:8px;margin:4px 0 14px}
.seg button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px}
.seg button.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.det{display:grid;grid-template-columns:130px 1fr;gap:16px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
dt{color:var(--mut)}dd{margin:0}
dd i{font-style:normal;background:var(--line);border-radius:99px;padding:1px 9px;margin:0 4px 4px 0;display:inline-block;font-size:13px}
.note{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:14px 0;white-space:pre-wrap}
.st{font-weight:700;margin:0 0 10px}
.st.w{color:var(--ok)}.st.n{color:var(--mut)}
#err{color:#d6455d;font-size:13px;margin-right:auto;align-self:center}
[hidden]{display:none!important}
.chip b{margin-left:6px;opacity:.7}
.yrs{display:flex;gap:8px}
#home{min-height:70vh;display:flex;flex-direction:column;justify-content:center}
#home h1{font:800 clamp(38px,9vw,68px)/1 'Bricolage Grotesque',sans-serif;letter-spacing:-.03em;margin:0 0 8px}
#home p{color:var(--mut);margin:0 0 28px;font-size:17px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.door{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 18px;text-align:left;min-height:180px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s,border-color .15s}
.door:hover{transform:translateY(-4px);border-color:var(--c)}
.door b{font:800 28px 'Bricolage Grotesque',sans-serif;color:var(--c)}
.door span{color:var(--mut);font-size:14px}
.back{background:none;border:0;color:var(--mut);padding:0;margin-bottom:14px}
@media(max-width:620px){.pick{grid-template-columns:1fr}.door{min-height:110px}}
@media(max-width:480px){.det{grid-template-columns:100px 1fr}#favs{gap:8px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div id="home"><div class="pick" id="pick"></div></div>
  <div id="cat" hidden>
  <button class="back" id="back">← All categories</button>
  
  <h2 id="favt"></h2>
  <div id="favs"></div>
  <div class="bar">
    <button class="chip on" data-f="all">All</button>
    <button class="chip" data-f="w">Watched</button>
    <button class="chip" data-f="u">Not watched</button>
    <input id="q" type="search" placeholder="Search your list" aria-label="Search">
    <button class="btn" id="add">Add</button>
  </div>
  <div id="grid"></div>
  </div>
</main>
<div id="ov"></div>
<script>
const mk=(rel,extra,before=[],t='yr')=>[['title','Name'],['genre','Genre'],['sub','Sub-elements (comma separated)'],['release',rel,t],...before,...extra];
const C={
 anime:{n:'Anime',c:'#ff4d8d',d:'Series, films and OVAs',f:mk('Anime release and finish year',[['author','Author'],['magazine','Magazine']],[['manga','Manga release and finish year','yr']])},
 tv:{n:'TV Series',c:'#3ec9ff',d:'Shows and miniseries',f:mk('Release and finish year',[['director','Director'],['network','Network or platform']])},
 movies:{n:'Movies',c:'#ffb020',d:'Features and shorts',f:mk('Release year',[['director','Director'],['studio','Studio']],[],'y1')}
};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const yin=(k,v,p)=>`<input type="number" inputmode="numeric" min="1900" max="2100" placeholder="${p}" data-k="${k}" value="${esc(v)}">`;
const val=(it,k,t)=>t==='yr'||t==='y1'?[it[k+'_a'],it[k+'_b']].filter(Boolean).join(' – '):it[k];
const blank=()=>Object.fromEntries(Object.keys(C).map(k=>[k,{items:[],favs:[null,null,null,null]}]));
let S=blank(),cat=null,filter='all',q='';
const cur=()=>S[cat], byId=id=>cur().items.find(i=>i.id===id);

/* storage: IndexedDB, falls back to memory */
const open=()=>new Promise((res,rej)=>{try{const r=indexedDB.open('shelf',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const openT=()=>Promise.race([open(),new Promise((_,j)=>setTimeout(j,1500))]);
async function load(){let r=null;try{const d=await openT();r=await new Promise(res=>{const g=d.transaction('kv').objectStore('kv').get('s');g.onsuccess=()=>res(g.result);g.onerror=()=>res(null)})}catch(e){}if(!r)try{r=JSON.parse(localStorage.getItem('shelf')||'null')}catch(e){}return r}
async function save(){let ok=false;try{const d=await openT();await new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(S,'s');t.oncomplete=res;t.onerror=()=>rej(t.error)});ok=true}catch(e){}if(!ok)try{localStorage.setItem('shelf',JSON.stringify(S))}catch(e){}}

function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const w=Math.min(420,i.width),h=Math.round(i.height*w/i.width),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);res(c.toDataURL('image/jpeg',.82))};i.src=r.result};r.readAsDataURL(file)})}
const pic=it=>it&&it.poster?`<img src="${it.poster}" alt="${esc(it.title)}">`:`<div class="ph">${esc(it?it.title:'')}</div>`;

function render(){
  $('#home').hidden=!!cat;$('#cat').hidden=!cat;
  $('#pick').innerHTML=Object.keys(C).map(c=>`<button class="door" data-c="${c}" style="--c:${C[c].c}"><b>${C[c].n}</b><span>${S[c].items.length} logged</span></button>`).join('');
  if(!cat)return;
  const d=cur(),k=C[cat];
  
  $('#favt').textContent=`Your 4 favorite ${k.n}`;
  $('#favs').innerHTML=d.favs.map((id,i)=>{const it=id&&byId(id);return `<button class="fav" data-i="${i}" title="${it?esc(it.title):'Choose a favorite'}" aria-label="Favorite slot ${i+1}">${it?pic(it):'<b>+</b>'}</button>`}).join('');
  const nW=d.items.filter(i=>i.watched).length,cnt={all:d.items.length,w:nW,u:d.items.length-nW},lb={all:'All',w:'Watched',u:'Not watched'};
  document.querySelectorAll('.chip').forEach(c=>{c.classList.toggle('on',c.dataset.f===filter);c.innerHTML=`${lb[c.dataset.f]} <b>${cnt[c.dataset.f]}</b>`});
  const L=d.items.filter(i=>(filter==='all'||(filter==='w')===!!i.watched)&&i.title.toLowerCase().includes(q));
  $('#grid').innerHTML=L.length?L.map(i=>`<div class="card" data-id="${i.id}"><div class="pw">${pic(i)}${i.watched?'<em>✓</em>':''}</div><p>${esc(i.title)}</p></div>`).join(''):`<div class="empty">${d.items.length?'Nothing matches that filter.':`Your ${k.n} list is empty. Tap Add to log your first one.`}</div>`;
}
const ov=$('#ov');
const show=h=>{ov.innerHTML=h;ov.classList.add('on');ov.scrollTop=0;document.body.style.overflow='hidden'};
const hide=()=>{ov.classList.remove('on');ov.innerHTML='';document.body.style.overflow=''};
ov.addEventListener('click',e=>{if(e.target===ov)hide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});

function openForm(id){
  const it=id?byId(id):{},F=C[cat].f;
  let fp=it.poster||'',fw=!!it.watched;
  show(`<div class="sheet"><h1>${id?'Edit':'Add'} ${esc(C[cat].n)}</h1>
  <label class="up">Poster<input type="file" id="pf" accept="image/*" hidden><div id="pp">${fp?`<img src="${fp}" alt="">`:'Tap to upload'}</div></label>
  ${F.map(([k,l,t])=>t==='yr'?`<label>${esc(l)}<span class="yrs">${yin(k+'_a',it[k+'_a'],'Release year')}${yin(k+'_b',it[k+'_b'],'Finish year')}</span></label>`:t==='y1'?`<label>${esc(l)}${yin(k+'_a',it[k+'_a'],'Year')}</label>`:`<label>${esc(l)}<input type="text" data-k="${k}" value="${esc(it[k])}"></label>`).join('')}
  <div style="font-size:13px;color:var(--mut)">Status</div>
  <div class="seg"><button data-w="1">Watched</button><button data-w="0">Not watched</button></div>
  <label>My note<textarea id="nt" placeholder="Thoughts, rating, where you stopped...">${esc(it.note)}</textarea></label>
  <div class="row"><span id="err"></span><button class="btn g" id="cx">Cancel</button><button class="btn" id="sv">Save changes</button></div></div>`);
  const seg=()=>ov.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',(b.dataset.w==='1')===fw));
  seg();
  ov.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{fw=b.dataset.w==='1';seg()});
  $('#pf').onchange=async e=>{const f=e.target.files[0];if(!f)return;fp=await shrink(f);$('#pp').innerHTML=`<img src="${fp}" alt="">`};
  $('#cx').onclick=()=>id?openDetail(id):hide();
  $('#sv').onclick=()=>{
    const o=id?it:{id:uid()};
    ov.querySelectorAll('[data-k]').forEach(e=>o[e.dataset.k]=e.value.trim());
    if(!o.title){$('#err').textContent='Add a name first.';return}
    o.poster=fp;o.watched=fw;o.note=$('#nt').value;
    if(!id)cur().items.unshift(o);
    save();render();id?openDetail(id):hide();
  };
}
function openDetail(id){
  const it=byId(id);if(!it)return hide();
  const rows=C[cat].f.slice(1).map(([k,l,t])=>[k,l,val(it,k,t)]).filter(r=>r[2]).map(([k,l,v])=>`<dt>${esc(l.replace(/ \(.*/,''))}</dt><dd>${k==='sub'?v.split(',').filter(s=>s.trim()).map(s=>`<i>${esc(s.trim())}</i>`).join(''):esc(v)}</dd>`).join('');
  show(`<div class="sheet"><div class="det"><div class="pw">${pic(it)}</div><div><h1>${esc(it.title)}</h1>
  <p class="st ${it.watched?'w':'n'}">${it.watched?'Watched':'Not watched yet'}</p><dl>${rows}</dl></div></div>
  ${it.note?`<div class="note">${esc(it.note)}</div>`:''}
  <div class="row"><button class="btn g" id="dl">Delete</button><button class="btn g" id="cl">Close</button><button class="btn" id="ed">Edit</button></div></div>`);
  $('#cl').onclick=hide;$('#ed').onclick=()=>openForm(id);
  let armed=false;
  $('#dl').onclick=e=>{
    if(!armed){armed=true;e.target.textContent='Tap again to delete';return}
    const d=cur();d.items=d.items.filter(i=>i.id!==id);d.favs=d.favs.map(f=>f===id?null:f);save();render();hide();
  };
}
function openPicker(slot){
  const d=cur();
  show(`<div class="sheet"><h1>Favorite ${slot+1}</h1>${d.items.length?`<div id="grid" style="grid-template-columns:repeat(auto-fill,minmax(100px,1fr))">${d.items.map(i=>`<div class="card" data-p="${i.id}"><div class="pw">${pic(i)}</div><p>${esc(i.title)}</p></div>`).join('')}</div>`:`<p class="empty">Add something to your list first, then pick it here.</p>`}
  <div class="row"><button class="btn g" id="rm">Clear slot</button><button class="btn g" id="cl">Close</button></div></div>`);
  $('#cl').onclick=hide;
  $('#rm').onclick=()=>{d.favs[slot]=null;save();render();hide()};
  ov.querySelectorAll('[data-p]').forEach(c=>c.onclick=()=>{
    const id=c.dataset.p;d.favs=d.favs.map(f=>f===id?null:f);d.favs[slot]=id;save();render();hide();
  });
}
document.addEventListener('click',e=>{
  if(ov.classList.contains('on')&&ov.contains(e.target))return;
  const t=e.target.closest('[data-c],[data-f],[data-i],[data-id],#add,#back');if(!t)return;
  if(t.dataset.c){cat=t.dataset.c;filter='all';q='';$('#q').value='';document.documentElement.style.setProperty('--ac',C[cat].c);scrollTo(0,0);render()}
  else if(t.dataset.f){filter=t.dataset.f;render()}
  else if(t.dataset.i!==undefined)openPicker(+t.dataset.i);
  else if(t.dataset.id)openDetail(t.dataset.id);
  else if(t.id==='add')openForm();
  else if(t.id==='back'){cat=null;scrollTo(0,0);render()}
});
$('#q').oninput=e=>{q=e.target.value.toLowerCase();render()};
render();
load().then(d=>{if(d){S=Object.assign(blank(),d);render()}});
</script>
</body>
</html>
